<!DOCTYPE html>
<html lang="en" class="rs-page rs-scout">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Scout Finder · Ram Shiri</title>
<meta name="description" content="Pick any of 3,880 players across 12 leagues: positional percentiles, the most similar players anywhere, and a scouting note written only from the numbers." />
<meta name="author" content="Ram Shiri" />
<link rel="icon" href="../assets/favicon.svg" type="image/svg+xml" />
<link rel="stylesheet" href="/assets/brand/brand.css" />
<script src="/assets/brand/brand.js"></script>
<style>
/* Scout Finder. Colours and type come from the brand kit's --rs-* tokens, so the
   page follows the C (HUD) and A (Matchday) looks without its own theme file. */
:root { --hi: #3ddc97; --lo: #ff6b6b; --maxw: 1180px; }
html[data-site-style] { color-scheme: dark; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--rs-bg); color: var(--rs-body); font: 15px/1.55 var(--rs-text); }
html[data-site-lang="he"] body { font-family: "IBM Plex Sans Hebrew", var(--rs-text); }
a { color: var(--rs-accent); }
button, input, select { font: inherit; color: inherit; }
.wrap { max-width: var(--maxw); margin: 0 auto; padding: 0 clamp(16px, 3vw, 32px); }

header.hero { padding: 40px 0 20px; border-bottom: 1px solid var(--rs-line); }
.kicker { font: 600 12px/1 var(--rs-display); letter-spacing: .2em; text-transform: uppercase; color: var(--rs-accent); }
h1 { margin: 10px 0 8px; font: 700 clamp(34px, 6vw, 58px)/1 var(--rs-display); color: var(--rs-ink); letter-spacing: .02em; text-transform: uppercase; }
html[data-site-style="a"] h1, html[data-site-style="a"] h2 { font-style: italic; font-weight: 800; }
.lead { max-width: 760px; margin: 0; color: var(--rs-body); }
.stats { display: flex; flex-wrap: wrap; gap: 8px 22px; margin-top: 16px; font: 600 13px/1 var(--rs-display); letter-spacing: .1em; text-transform: uppercase; color: var(--rs-muted); }
.stats b { color: var(--rs-ink); font-size: 18px; margin-inline-end: 6px; }

h2 { margin: 0 0 12px; font: 700 20px/1.1 var(--rs-display); letter-spacing: .08em; text-transform: uppercase; color: var(--rs-ink); }
.panel { background: var(--rs-panel); border: 1px solid var(--rs-line); padding: 18px; }
.muted { color: var(--rs-muted); }
.small { font-size: 13px; }

/* search */
.search { position: relative; margin: 22px 0 18px; }
.search input { width: 100%; padding: 14px 16px; background: var(--rs-bg-soft); border: 1px solid var(--rs-line-strong); color: var(--rs-ink); font-size: 17px; outline: none; }
.search input:focus { border-color: var(--rs-accent); }
.hits { position: absolute; inset-inline: 0; top: 100%; z-index: 20; max-height: 360px; overflow: auto; margin: 0; padding: 0; list-style: none; background: var(--rs-panel-2); border: 1px solid var(--rs-line-strong); border-top: 0; }
.hits li { display: flex; gap: 10px; align-items: baseline; padding: 9px 14px; cursor: pointer; }
.hits li[aria-selected="true"], .hits li:hover { background: var(--rs-accent-soft); }
.hits .n { color: var(--rs-ink); font-weight: 600; }
.chip { display: inline-block; padding: 3px 7px; border: 1px solid var(--rs-line-strong); font: 600 11px/1 var(--rs-display); letter-spacing: .1em; color: var(--rs-muted); white-space: nowrap; }
.chip.g { color: var(--rs-accent); border-color: var(--rs-accent); }
html[data-site-style="a"] .chip { transform: skewX(-10deg); }

/* profile */
.profile { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 18px; }
@media (max-width: 860px) { .profile { grid-template-columns: 1fr; } }
.who { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 14px; margin-bottom: 4px; }
.who h2 { font-size: clamp(26px, 4vw, 36px); margin: 0; letter-spacing: .03em; text-transform: none; }
.meta { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0 16px; }
.toggle { display: inline-flex; border: 1px solid var(--rs-line-strong); margin-bottom: 14px; }
.toggle button { padding: 7px 12px; background: transparent; border: 0; cursor: pointer; font: 600 12px/1 var(--rs-display); letter-spacing: .1em; text-transform: uppercase; color: var(--rs-muted); }
.toggle button[aria-pressed="true"] { background: var(--rs-accent); color: var(--rs-accent-ink); }
.bars { display: grid; gap: 10px; }
.bar { display: grid; grid-template-columns: minmax(120px, 190px) 1fr 44px; gap: 10px; align-items: center; }
.bar .lab { color: var(--rs-ink); font-size: 14px; }
.bar .lab small { display: block; color: var(--rs-muted); font-size: 12px; }
.track { position: relative; height: 12px; background: var(--rs-bg-soft); border: 1px solid var(--rs-line); }
.track i { position: absolute; inset-block: 0; inset-inline-start: 0; background: var(--rs-body); }
.track i.hi { background: var(--hi); } .track i.lo { background: var(--lo); }
.track::after { content: ""; position: absolute; inset-block: -3px; inset-inline-start: 50%; width: 1px; background: var(--rs-line-strong); }
.bar .p { font: 700 16px/1 var(--rs-display); color: var(--rs-ink); text-align: end; }
.bar .p.na { color: var(--rs-muted); font-weight: 500; font-size: 13px; }

.radar svg { width: 100%; max-width: 480px; display: block; margin: 0 auto; }
.radar .ax { stroke: var(--rs-line); fill: none; }
.radar .ring { stroke: var(--rs-line); fill: none; }
.radar .me { fill: var(--rs-accent-soft); stroke: var(--rs-accent); stroke-width: 2; }
.radar .vs { fill: rgba(255, 61, 242, .10); stroke: var(--rs-goal); stroke-width: 1.5; stroke-dasharray: 5 4; }
html[data-site-style="a"] .radar .vs { fill: rgba(255, 255, 255, .06); stroke: #f5f7fa; }
.radar text { fill: var(--rs-muted); font: 500 11px var(--rs-text); }
.legend { display: flex; gap: 16px; justify-content: center; font-size: 13px; margin-top: 6px; }
.legend span::before { content: ""; display: inline-block; width: 14px; height: 3px; margin-inline-end: 6px; vertical-align: middle; background: var(--rs-accent); }
.legend span.vs::before { background: var(--rs-goal); }
html[data-site-style="a"] .legend span.vs::before { background: #f5f7fa; }

.note { margin-top: 18px; border-inline-start: 3px solid var(--rs-accent); }
.note p { margin: 0 0 10px; color: var(--rs-ink); }
.note p:last-child { margin: 0; }
.note b { color: var(--rs-accent); font-weight: 600; }

table { width: 100%; border-collapse: collapse; font-size: 14px; }
th { text-align: start; font: 600 11px/1 var(--rs-display); letter-spacing: .12em; text-transform: uppercase; color: var(--rs-muted); padding: 8px 8px; border-bottom: 1px solid var(--rs-line-strong); white-space: nowrap; }
td { padding: 9px 8px; border-bottom: 1px solid var(--rs-line); }
td.num, th.num { text-align: end; font-variant-numeric: tabular-nums; }
tbody tr { cursor: pointer; }
tbody tr:hover, tbody tr.on { background: var(--rs-accent-soft); }
td .n { color: var(--rs-ink); font-weight: 600; }
.score { font: 700 15px/1 var(--rs-display); color: var(--rs-accent); }
.tablewrap { overflow-x: auto; }

section.block { margin: 28px 0; }
.filters { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 12px; }
.filters label { display: grid; gap: 4px; font: 600 11px/1 var(--rs-display); letter-spacing: .12em; text-transform: uppercase; color: var(--rs-muted); }
.filters select { min-width: 150px; padding: 8px 10px; background: var(--rs-bg-soft); border: 1px solid var(--rs-line-strong); color: var(--rs-ink); text-transform: none; letter-spacing: 0; font: 14px var(--rs-text); }
footer { padding: 26px 0 50px; border-top: 1px solid var(--rs-line); font-size: 13px; color: var(--rs-muted); }
footer p { max-width: 860px; }
#loading { padding: 40px 0; }
[hidden] { display: none !important; }
/* ---- v2: head-to-head, filters, archetypes, seasons ---- */
.hero-row { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 12px; }
.season select, .filters select, .h2h-pick input { padding: 8px 10px; background: var(--rs-bg-soft); border: 1px solid var(--rs-line-strong); color: var(--rs-ink); font: 14px var(--rs-text); }
.season { display: grid; gap: 4px; font: 600 11px/1 var(--rs-display); letter-spacing: .12em; text-transform: uppercase; color: var(--rs-muted); }
.actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
.btn { padding: 8px 12px; background: transparent; border: 1px solid var(--rs-line-strong); color: var(--rs-ink); cursor: pointer; font: 600 12px/1 var(--rs-display); letter-spacing: .1em; text-transform: uppercase; }
.btn:hover, .btn:focus-visible { border-color: var(--rs-accent); color: var(--rs-accent); }
html[data-site-style="a"] .btn { transform: skewX(-10deg); }
.chip.arch { color: var(--rs-accent-ink); background: var(--rs-accent); border-color: var(--rs-accent); }
.h2h-head { display: grid; grid-template-columns: 1fr auto 1fr; gap: 12px; align-items: center; margin-bottom: 14px; }
.h2h-head .side { min-width: 0; }
.h2h-head .side.b { text-align: end; }
.h2h-head .nm { font: 700 22px/1.1 var(--rs-display); color: var(--rs-ink); }
.h2h-head .vs { font: 700 14px/1 var(--rs-display); color: var(--rs-muted); letter-spacing: .2em; }
.h2h-pick { position: relative; margin-bottom: 14px; max-width: 420px; }
.h2h-pick input { width: 100%; }
.h2h-row { display: grid; grid-template-columns: 70px 1fr minmax(110px, 170px) 1fr 70px; gap: 10px; align-items: center; padding: 7px 0; border-bottom: 1px solid var(--rs-line); }
.h2h-row .v { font-variant-numeric: tabular-nums; color: var(--rs-ink); }
.h2h-row .v.b { text-align: end; }
.h2h-row .m { text-align: center; font-size: 13px; color: var(--rs-body); }
.h2h-row .t { position: relative; height: 10px; background: var(--rs-bg-soft); }
.h2h-row .t i { position: absolute; inset-block: 0; background: var(--rs-accent); }
.h2h-row .t.a i { inset-inline-end: 0; }
.h2h-row .t.b i { inset-inline-start: 0; background: var(--rs-goal); }
html[data-site-style="a"] .h2h-row .t.b i { background: #f5f7fa; }
.h2h-row .win { font-weight: 700; color: var(--rs-accent); }
@media (max-width: 640px) { .h2h-row { grid-template-columns: 48px 1fr 90px 1fr 48px; font-size: 13px; } }
.filters .opt[hidden] { display: none; }
.empty { padding: 14px; color: var(--rs-muted); }
</style>
</head>
<body>
<header class="hero">
  <div class="wrap">
    <div class="kicker" id="kicker">Scouting tool · 2025-26</div>
    <h1>Scout Finder</h1>
    <div class="hero-row">
      <p class="lead" data-t="lead"></p>
      <label class="season" id="seasonBox" hidden><span data-t="season">Season</span><select id="season"></select></label>
    </div>
    <div class="stats" id="stats"></div>
  </div>
</header>

<main class="wrap">
  <div class="search">
    <input id="q" type="search" autocomplete="off" spellcheck="false" role="combobox" aria-expanded="false" aria-controls="hits" />
    <ul class="hits" id="hits" role="listbox" hidden></ul>
  </div>

  <p id="loading" class="muted" data-t="loading">Loading players…</p>

  <div id="app" hidden>
    <div class="profile">
      <div class="panel" id="card"></div>
      <div>
        <div class="panel radar" id="radar"></div>
        <div class="panel note" id="note"></div>
      </div>
    </div>

    <section class="block" id="h2hBlock">
      <h2 data-t="h2hTitle">Head to head</h2>
      <div class="h2h-pick">
        <input id="q2" type="search" autocomplete="off" spellcheck="false" role="combobox" aria-expanded="false" aria-controls="hits2" />
        <ul class="hits" id="hits2" role="listbox" hidden></ul>
      </div>
      <div class="panel" id="h2h"></div>
    </section>

    <section class="block">
      <h2 data-t="simTitle">Most similar players</h2>
      <p class="muted small" data-t="simLead"></p>
      <div class="filters" id="simFilters"></div>
      <div class="panel tablewrap" id="similar"></div>
    </section>

    <section class="block">
      <h2 data-t="findTitle">Find players</h2>
      <div class="filters">
        <label><span data-t="pos">Position</span><select id="fGroup"></select></label>
        <label><span data-t="league">League</span><select id="fLeague"></select></label>
        <label><span data-t="sortBy">Sort by</span><select id="fMetric"></select></label>
      </div>
      <div class="filters" id="findFilters"></div>
      <div class="panel tablewrap" id="finder"></div>
    </section>
  </div>
</main>

<footer>
  <div class="wrap" id="method"></div>
</footer>

<script>
/* About panel for the portfolio bar (brand.js). */
window.RS_ABOUT = {
  en: {
    title: "How Scout Finder works",
    intro: "A scouting engine over twelve leagues: every player's numbers per 90 minutes, ranked against the same position, with the most similar profiles anywhere and a scouting note written only from the numbers.",
    sections: [
      { h: "Data", p: "Per-match player stats from FotMob for every finished league match, summed to the season. Twelve leagues: the big five, Portugal, the Netherlands, Belgium, the Championship, Brazil, Argentina and Israel. Only players with 900+ league minutes are ranked (fewer early in a season)." },
      { h: "Positions", p: "A player's position is the lineup slot he started in most. FotMob's slots cannot tell a holding midfielder from a box-to-box one, so central midfield is one group unless the data marks a separate defensive-midfield group by its stats." },
      { h: "League strength", p: "Each league's strength is the mean ClubElo rating of its clubs. Attacking volume (xG, shots, chances created and so on) is scaled by exp(β × Elo gap / 100) against the Premier League, so 0.5 xG per 90 in Belgium is not read as 0.5 in England. The switch on each profile shows the unadjusted ranking within the player's own league." },
      { h: "Similar players", p: "Cosine similarity of z-scored, league-adjusted per-90 rates within the same position. z-scoring compares a player's shape (more tackles than usual, fewer shots than usual), not raw volume. A metric a league does not publish counts as average." },
      { h: "Limits", p: "No free source publishes progressive passes or carries. Israel's league publishes no xG or xA. The league adjustment is a first heuristic until it is calibrated on players who changed leagues." }
    ]
  },
  he: {
    title: "איך Scout Finder עובד",
    intro: "מנוע סקאוטינג על 12 ליגות: הנתונים של כל שחקן ל־90 דקות, מדורגים מול אותה עמדה, עם הפרופילים הכי דומים בכל מקום ודוח סקאוטינג שנכתב רק מתוך המספרים.",
    sections: [
      { h: "נתונים", p: "סטטיסטיקה לכל שחקן בכל משחק ליגה שהסתיים, מ־FotMob, מסוכמת לעונה. 12 ליגות: חמש הגדולות, פורטוגל, הולנד, בלגיה, הצ'מפיונשיפ, ברזיל, ארגנטינה וליגת העל. מדורגים רק שחקנים עם 900 דקות ליגה ומעלה (פחות בתחילת עונה)." },
      { h: "עמדות", p: "העמדה של שחקן היא המשבצת שבה פתח הכי הרבה. המשבצות של FotMob לא מבחינות בין קשר אחורי לקשר מרכזי, ולכן הקישור המרכזי הוא קבוצה אחת, אלא אם הנתונים מסמנים קבוצת קשרים אחוריים לפי הסטטיסטיקה." },
      { h: "חוזק ליגה", p: "החוזק של כל ליגה הוא ממוצע דירוג ClubElo של הקבוצות שלה. מדדי נפח התקפי (xG, בעיטות, מצבים שיצר וכו') מוכפלים ב־exp(β × הפרש Elo / 100) מול הפרמייר ליג, כך ש־0.5 xG ל־90 בבלגיה לא נקרא כמו 0.5 באנגליה. המתג בכל פרופיל מציג את הדירוג בלי התאמה, בתוך הליגה של השחקן." },
      { h: "שחקנים דומים", p: "דמיון קוסינוס על ערכים מתוקננים (z-score) ל־90 דקות, אחרי התאמה לחוזק הליגה, בתוך אותה עמדה. התקנון משווה את צורת הפרופיל (יותר תיקולים מהממוצע, פחות בעיטות), לא נפח גולמי. מדד שליגה לא מפרסמת נחשב ממוצע." },
      { h: "מגבלות", p: "אף מקור חינמי לא מפרסם מסירות או נשיאות כדור מתקדמות. ליגת העל לא מפרסמת xG ו־xA. ההתאמה לחוזק ליגה היא הערכה ראשונית עד שתכויל על שחקנים שעברו ליגה." }
    ]
  }
};
</script>

  function radarSvg(p, q, opts) {
    opts = opts || {};
    var metrics = metricsOf(p.group), n = metrics.length, W = opts.w || 560, H = opts.h || 400, cx = opts.cx || 280, cy = opts.cy || 200, R = opts.r || 140;
    function pt(i, r) { var a = -Math.PI / 2 + 2 * Math.PI * i / n; return [cx + r * Math.cos(a), cy + r * Math.sin(a)]; }
    function poly(x) { return metrics.map(function (m, i) { var v = x.pct[m]; return pt(i, R * (v == null ? 0 : v) / 100).map(function (z) { return z.toFixed(1); }).join(","); }).join(" "); }
    var c = opts.colors || {};

      s += '<text fill="' + (c.muted || "") + '" font-size="' + (opts.fs || 11) + '" font-family="sans-serif" x="' + l[0].toFixed(1) + '" y="' + (l[1] + 4).toFixed(1) + '" text-anchor="' + anchor + '">' + esc(mShort(m)) + "</text>";
    });

    s += '<polygon class="me" ' + (c.accent ? 'fill="' + c.accentSoft + '" stroke-width="2.5" stroke="' + c.accent + '"' : "") + ' points="' + poly(p) + '"/></svg>';

    if (strong.length) out.push((he ? "בולט מול כל ה" + grp(p.group, true) + " ב־12 הליגות ב: " : "Stands out against all " + grp(p.group, true) + " in the twelve leagues for ") + listJoin(strong.slice(0, 3).map(line)) + ".");
    else if (top.length) out.push((he ? "אין מדד באחוזון 80 ומעלה. הצד החזק ביותר: " : "No metric reaches the 80th percentile. Best area: ") + line(top[0]) + ".");
    if (weak.length) out.push((he ? "מתחת לרמה ב: " : "Below par for ") + listJoin(weak.slice(0, 3).map(line)) + ".");
    var gap = metrics.filter(function (m) { return p.pct[m] != null && p.pct_league[m] != null && p.pct_league[m] - p.pct[m] >= 25; });
    if (gap.length) out.push(he

        .sort(function (a, b) { return Math.abs(p.pct[b] - prev.pct[b]) - Math.abs(p.pct[a] - prev.pct[a]); }).slice(0, 3);
      if (moved.length) out.push((he ? "לעומת " + prevS + ": " : "Compared with " + prevS + ": ") + listJoin(moved.map(function (m) {
        return esc(mShort(m)) + " " + prev.pct[m] + " → " + p.pct[m];

    }

      ? lg(p.league) + " לא מפרסמת חלק מהמדדים (למשל xG ו־xA), ולכן הם חסרים כאן ולא נחשבים כאפס."

    $("note").innerHTML = "<h2>" + t("noteTitle") + "</h2>" + out.map(function (s) { return "<p>" + s + "</p>"; }).join("");
  }

      : "<p>Data: per-match player stats from FotMob, summed to the season and expressed per 90 minutes. Only players with 900+ league minutes are ranked (fewer early in a season). Position is the slot a player started in most.</p>" +
        "<p>League strength is the mean ClubElo rating of each league's clubs. Attacking volume is scaled by exp(" + b + " × Elo gap / 100) against the Premier League; " +
        (beta ? "β was fitted on " + beta.n + " players who changed leagues" + (beta.ci ? " (range " + beta.ci[0] + "–" + beta.ci[1] + ")" : "") + "." : "it is a first heuristic, not a calibrated model.") +
        " Similar players are the cosine similarity of z-scored per-90 rates within the same position. The profile label (creator, anchor and so on) is the metric family with the highest mean percentile.</p>" +
        (ram.length ? "<p>xG in the " + listJoin(ram) + " comes from Ram's own xG model; elsewhere from FotMob.</p>" : "") +
        '<p>Code: <a href="https://github.com/RShiri/RShiri.github.io/tree/main/scout-finder">scout-finder/pipeline</a>.</p>';
    if (seasons.length > 1) {
      $("seasonBox").hidden = false;
      $("season").innerHTML = seasons.map(function (s) { return '<option value="' + s + '">' + s + "</option>"; }).join("");
      $("season").value = season;
    }
    fillFilters(); fillMetrics(); renderFinder();
    if (current) renderProfile();
  }

  function switchSeason(s, wantA, wantB) {
    $("loading").hidden = false;
    return load(s).then(function (d) {
      season = s; use(d); $("loading").hidden = true; $("app").hidden = false;
      var a = byId[wantA] || (current && byId[current.id]) || byId["fotmob:1467236"] || players[0];
      renderStatic(); open(a.id, wantB, false);
      // The previous season feeds the note's "compared with" line; fetch it quietly.
      var prev = seasons[seasons.indexOf(s) + 1];
      if (prev && !cache[prev]) load(prev).then(function () { if (season === s) renderNote(); }).catch(function () {});
    });
  }

  function wire() {
    combobox($("q"), $("hits"), function (id) { open(id); });
    combobox($("q2"), $("hits2"), setCompare, function () { return current && current.group; });
    $("card").addEventListener("click", function (e) {
      var b = e.target.closest("button[data-mode]");
      if (b) { mode = b.getAttribute("data-mode"); renderProfile(); return; }
      var act = e.target.closest("button[data-act]"); if (!act) return;
      if (act.getAttribute("data-act") === "png") downloadCard();
      else if (navigator.clipboard) navigator.clipboard.writeText(location.href).then(function () { act.textContent = t("copied"); }).catch(function () {});
    });
    $("similar").addEventListener("click", function (e) {
      var a = e.target.closest("[data-open]");
      if (a) { e.preventDefault(); open(a.getAttribute("data-open")); return; }
      var tr = e.target.closest("tr[data-id]");
      if (tr) { setCompare(tr.getAttribute("data-id")); $("h2hBlock").scrollIntoView({ behavior: "smooth", block: "start" }); }
    });
    $("simFilters").addEventListener("change", renderSimilar);
    $("finder").addEventListener("click", function (e) { var tr = e.target.closest("tr[data-open]"); if (tr) open(tr.getAttribute("data-open")); });
    $("fGroup").addEventListener("change", function () { fillMetrics(); renderFinder(); });
    $("fLeague").addEventListener("change", renderFinder);
    $("fMetric").addEventListener("change", renderFinder);
    $("findFilters").addEventListener("change", renderFinder);
    $("season").addEventListener("change", function () { switchSeason($("season").value, current && current.id); });
    window.addEventListener("hashchange", function () {
      var h = parseHash();
      if (h.season && h.season !== season && seasons.indexOf(h.season) >= 0) { switchSeason(h.season, h.a, h.b); return; }
      if (byId[h.a] && (byId[h.a] !== current || (h.b && byId[h.b] !== compare))) open(h.a, h.b, false);
    });
    window.addEventListener("sitelangchange", function (e) { lang = e.detail === "he" ? "he" : "en"; renderStatic(); });
  }

  lang = document.documentElement.getAttribute("data-site-lang") === "he" ? "he" : "en";
  renderStatic(); wire();
  // data/seasons.json lists the season files when there is more than one; without it, one season.
  fetch("data/seasons.json").then(function (r) { return r.ok ? r.json() : null; }).catch(function () { return null; }).then(function (s) {
    if (s && s.seasons && s.seasons.length) { seasons = s.seasons; season = DEFAULT_SEASON = s["default"] || s.seasons[0]; }
    var h = parseHash();
    if (h.season && seasons.indexOf(h.season) >= 0) season = h.season;
    return switchSeason(season, h.a, h.b);
  }).catch(function (err) { $("loading").textContent = "Could not load the data (" + err.message + ")"; });
})();
</script>
</body>
</html>
